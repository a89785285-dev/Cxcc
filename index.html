<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2456e0">
  <meta name="description" content="BLOCK MASTER — a colorful block puzzle game.">
  <title>BLOCK MASTER</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23ffb52e'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/blocks.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app" id="app">
  <section class="screen screen--home is-active" id="screen-home" aria-label="Home">
    <div class="deco-cubes" id="deco-cubes" aria-hidden="true"></div>
    <div class="home">
      <button type="button" class="icon-btn home__settings" id="settings-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="3.2 2.2"/>
          <path fill="currentColor" fill-rule="evenodd" d="M12 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 1 0 0-12.4zm0 3.4a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6z"/>
        </svg>
      </button>
      <div class="home__stage">
        <div class="home__glow" aria-hidden="true"></div>
        <header class="logo">
          <svg class="logo__crown" viewBox="0 0 24 24" aria-hidden="true">
            <defs><linearGradient id="crown-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#ffc83a"/><stop offset="1" stop-color="#e08a00"/></linearGradient></defs>
            <path fill="url(#crown-gold)" d="M3 17.5 L1.8 8 L7.6 12.2 L12 4.2 L16.4 12.2 L22.2 8 L21 17.5 Z"/>
            <rect fill="#e08a00" x="3" y="18.2" width="18" height="3.2" rx="1.6"/>
          </svg>
          <h1 class="logo__title">BLOCK MASTER</h1>
          <p class="logo__puzzle">PUZZLE</p>
        </header>
        <button type="button" class="btn-classic" id="classic-btn">
          <svg class="btn-classic__icon" viewBox="8 4 48 24" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 16 C26 6 14 6 14 16 C14 26 26 26 32 16 C38 6 50 6 50 16 C50 26 38 26 32 16 Z"/></svg>
          <span class="btn-classic__label">CLASSIC</span>
        </button>
      </div>
    </div>
  </section>

  <section class="screen screen--game" id="screen-game" aria-label="Game" aria-hidden="true" inert>
    <main class="game-layout">
      <header class="game-header">
        <div class="stat-card"><span class="stat-label">SCORE</span><strong id="score-value">0</strong></div>
        <div class="stat-card stat-card--best"><span class="stat-label">BEST</span><strong id="best-value">0</strong></div>
        <button type="button" class="icon-btn game-settings" id="game-settings-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3.5h-4L10.6 6a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.7 7.7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        </button>
      </header>

      <div class="board-wrap">
        <div class="board" id="game-board" role="grid" aria-label="10 by 10 game board"></div>
        <div class="board-message" id="board-message" aria-live="polite"></div>
      </div>

      <section class="tray-section" aria-label="Available pieces">
        <div class="tray-heading">YOUR BLOCKS</div>
        <div class="piece-tray" id="piece-tray"></div>
      </section>
      <div class="game-footer">
        <span>BLOCK MASTER</span>
        <span id="round-label">CLASSIC</span>
      </div>
    </main>
  </section>

  <div class="modal-backdrop" id="settings-modal" hidden>
    <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h2 id="settings-title">SETTINGS</h2>
      <label class="setting-row"><span>Sound Effects</span><input type="checkbox" id="sound-toggle" checked></label>
      <label class="setting-row"><span>Music</span><input type="checkbox" id="music-toggle"></label>
      <label class="setting-row setting-volume"><span>Volume</span><input type="range" id="volume-control" min="0" max="1" step=".05" value=".55"></label>
      <button class="panel-button panel-button--primary" id="resume-btn" type="button">RESUME</button>
      <button class="panel-button" id="home-btn" type="button">HOME</button>
    </section>
  </div>

  <div class="modal-backdrop" id="gameover-modal" hidden>
    <section class="settings-panel result-panel" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
      <div class="result-crown" aria-hidden="true">✦</div>
      <h2 id="gameover-title">GAME OVER</h2>
      <div class="result-line"><span>YOUR SCORE</span><strong id="final-score">0</strong></div>
      <div class="result-line"><span>BEST SCORE</span><strong id="final-best">0</strong></div>
      <div class="reward-line"><span>REWARD</span><strong id="final-reward">+1,000</strong></div>
      <button class="panel-button panel-button--primary" id="retry-btn" type="button">RETRY</button>
      <button class="panel-button" id="result-home-btn" type="button">HOME</button>
    </section>
  </div>
</div>

<script src="js/navigation.js"></script>
<script src="js/animations.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/board.js"></script>
<script src="js/pieces.js"></script>
<script src="js/scoring.js"></script>
<script src="js/rewards.js"></script>
<script src="js/drag-drop.js"></script>
<script src="js/settings.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
